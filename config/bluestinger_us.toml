# Configuracao por jogo: Blue Stinger NTSC-U.
# Contem apenas metadados e enderecos (fatos), nunca bytes do jogo.
# O esquema completo sera definido nos marcos M1 (secao [input]) e M3 (demais).

[game]
title      = "Blue Stinger"
product_id = "T13001N"
version    = "V1.000"
ip_date    = "19990705"
region     = "JUE"
os         = "katana"          # bit 0 dos perifericos = 0 (nao e Windows CE)

[input]
# Hash SHA-256 do 1ST_READ.BIN suportado (o mesmo de tools/extractor/known_versions.h).
first_read_sha256 = "013301f3bd5e8305058f661ec3a0cddcb8468b524a2c5f4d8f88e4d523d21a50"   # rip CDI; o hash do GD original pode diferir
first_read_size   = 1975556

[load]
base  = 0x8C010000
entry = 0x8C010000

[analysis]
pointer_candidates = true   # constantes do pool que apontam para inicio de funcao
data_pointers      = true   # palavras de dados que apontam para inicio de funcao

[codegen]
# false: o jogo escreve em palavras do pool em tempo de execucao (p.ex. a pilha de
# interrupcao em 8C198478, gravada por 8C19830E-8C198312); embutir o valor do arquivo
# daria resultado errado. As constantes continuam guiando a analise de fluxo, e os
# alvos resolvidos sao conferidos em tempo de execucao (BS_EXPECT_TARGET).
inline_pool_constants = false
funcs_per_file        = 400

# --- biblioteca de threads cooperativa ---
# setjmp 8C099F8C grava R15, R14, PR, R13-R0, MACH/MACL, GBR, FPSCR, FPUL e FR0-FR15 em
# @r4 e devolve 0. longjmp 8C099F18 restaura esse contexto e faz rts para o PR salvo
# com r0 = r5 (1 se 0). O yield (8C09037E) faz `if (setjmp(atual) == 0)
# longjmp(escalonador, 1)`, o escalonador (8C0903C0) faz longjmp para cada thread, e a
# criacao (8C090146) monta o contexto com PR = funcao de entrada e pilha nova.
# Verificado no disassembly em 2026-10-14 (ver STATUS.md, Maple).
[threads]
setjmp  = [0x8C099F8C]
longjmp = [0x8C099F18]

# --- codigo copiado para a RAM (R3) ---
# 8C17C460 instala os vetores de excecao/interrupcao do Katana em VBR (0x8C00F400):
# copia o stub de 8C198140 para VBR+0x100 e VBR+0x400, e o de 8C198174 para
# VBR+0x600, depois de corrigir o literal de destino no pool (8C17C48E-8C17C494).
# Verificado em 2026-10-13: RAM do Flycast em VBR+0x100/0x400/0x600 = esses bytes
# (exceto o pool). Cada stub tem 0x34 bytes (codigo + pool).
[[relocated]]
dest   = 0x8C00F500
source = 0x8C198140
size   = 0x34

[[relocated]]
dest   = 0x8C00F800
source = 0x8C198140
size   = 0x34

[[relocated]]
dest   = 0x8C00FA00
source = 0x8C198174
size   = 0x34

# Destinos que 8C17C460 grava no pool dos stubs (alcancados so via RAM):
[[functions]]
address = 0x8C1982F4   # tratador de interrupcao (literal em 8C17C4F4)

[[functions]]
address = 0x8C1981A8   # tratador de excecao (literal original em 8C198170/8C1981A4)

# --- overrides manuais (exemplos) ---
# [[functions]]          # funcoes extras / fronteiras forcadas
# address = 0x8C0xxxxx
# size    = 0x40
#
# [[jump_tables]]        # tabelas de salto manuais
# braf_address = 0x8C0xxxxx
# table        = 0x8C0xxxxx
# count        = 8
#
# [[data_ranges]]        # regioes do executavel que sao dados
# start = 0x8C0xxxxx
# end   = 0x8C0xxxxx
#
# [[overrides]]          # funcoes substituidas por codigo em runtime/game/overrides
# address = 0x8C0xxxxx
# name    = "wait_vblank"
#
# [[midasm_hooks]]
# address   = 0x8C0xxxxx
# name      = "on_room_load"
# registers = ["r4", "r5"]
