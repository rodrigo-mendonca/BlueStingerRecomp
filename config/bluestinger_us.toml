# Configuracao por jogo: Blue Stinger NTSC-U.
# Contem apenas metadados e enderecos (fatos), nunca bytes do jogo.
# O esquema completo sera definido nos marcos M1 (secao [input]) e M3 (demais).

[game]
title      = "Blue Stinger"
product_id = "T13001N"
version    = "V1.000"
ip_date    = "19990705"
region     = "JUE"
os         = "katana"          # bit 0 dos perifericos = 0 (nao e Windows CE)

[input]
# Hash SHA-256 do 1ST_READ.BIN suportado (o mesmo de tools/extractor/known_versions.h).
first_read_sha256 = "013301f3bd5e8305058f661ec3a0cddcb8468b524a2c5f4d8f88e4d523d21a50"   # rip CDI; o hash do GD original pode diferir
first_read_size   = 1975556

[load]
base  = 0x8C010000
entry = 0x8C010000

[analysis]
pointer_candidates = true   # constantes do pool que apontam para inicio de funcao
data_pointers      = true   # palavras de dados que apontam para inicio de funcao

[codegen]
# false: o jogo escreve em palavras do pool em tempo de execucao (p.ex. a pilha de
# interrupcao em 8C198478, gravada por 8C19830E-8C198312); embutir o valor do arquivo
# daria resultado errado. As constantes continuam guiando a analise de fluxo, e os
# alvos resolvidos sao conferidos em tempo de execucao (BS_EXPECT_TARGET).
inline_pool_constants = false
funcs_per_file        = 400

# --- biblioteca de threads cooperativa ---
# setjmp 8C099F8C grava R15, R14, PR, R13-R0, MACH/MACL, GBR, FPSCR, FPUL e FR0-FR15 em
# @r4 e devolve 0. longjmp 8C099F18 restaura esse contexto e faz rts para o PR salvo
# com r0 = r5 (1 se 0). O yield (8C09037E) faz `if (setjmp(atual) == 0)
# longjmp(escalonador, 1)`, o escalonador (8C0903C0) faz longjmp para cada thread, e a
# criacao (8C090146) monta o contexto com PR = funcao de entrada e pilha nova.
# Verificado no disassembly em 2026-10-14 (ver STATUS.md, Maple).
[threads]
setjmp  = [0x8C099F8C]
longjmp = [0x8C099F18]

# --- codigo copiado para a RAM (R3) ---
# 8C17C460 instala os vetores de excecao/interrupcao do Katana em VBR (0x8C00F400):
# copia o stub de 8C198140 para VBR+0x100 e VBR+0x400, e o de 8C198174 para
# VBR+0x600, depois de corrigir o literal de destino no pool (8C17C48E-8C17C494).
# Verificado em 2026-10-13: RAM do Flycast em VBR+0x100/0x400/0x600 = esses bytes
# (exceto o pool). Cada stub tem 0x34 bytes (codigo + pool).
[[relocated]]
dest   = 0x8C00F500
source = 0x8C198140
size   = 0x34

[[relocated]]
dest   = 0x8C00F800
source = 0x8C198140
size   = 0x34

[[relocated]]
dest   = 0x8C00FA00
source = 0x8C198174
size   = 0x34

# Destinos que 8C17C460 grava no pool dos stubs (alcancados so via RAM):
[[functions]]
address = 0x8C1982F4   # tratador de interrupcao (literal em 8C17C4F4)

[[functions]]
address = 0x8C1981A8   # tratador de excecao (literal original em 8C198170/8C1981A4)

# --- overrides manuais (exemplos) ---
# [[functions]]          # funcoes extras / fronteiras forcadas
# address = 0x8C0xxxxx
# size    = 0x40
#
# [[jump_tables]]        # tabelas de salto manuais
# braf_address = 0x8C0xxxxx
# table        = 0x8C0xxxxx
# count        = 8
#
# [[data_ranges]]        # regioes do executavel que sao dados
# start = 0x8C0xxxxx
# end   = 0x8C0xxxxx
#
# [[overrides]]          # funcoes substituidas por codigo em runtime/game/overrides
# address = 0x8C0xxxxx
# name    = "wait_vblank"
#
# [[midasm_hooks]]
# address   = 0x8C0xxxxx
# name      = "on_room_load"
# registers = ["r4", "r5"]

# --- port nativo: fronteiras migraveis (docs/N1-PLANO.md) ---
# Chamadas sempre pelo slot, em todos os builds, para o provedor (legado/nativo) poder ser
# trocado em execucao. N1: a API gdFs (Shinobi 1.05) que cria ou recebe GDFS, identificada por
# contrato (disassembly + trace de argumentos/retornos, 2026-10-15). Nomes do SDK Katana.
[native]
slots = [
  0x8C15BF60,  # gdFsOpen(nome, dirrec) -> GDFS
  0x8C15B626,  # gdFsChangeDir(nome)
  0x8C15B644,  # gdFsClose(gdfs)
  0x8C15B680,  # gdFsGetFileSize(gdfs, &bytes)
  0x8C15B69A,  # gdFsGetFileSctSize(gdfs, &setores)
  0x8C15B6B4,  # gdFsGetFileFad(gdfs, &fad)        (guarda: sem equivalente nativo)
  0x8C15B6CE,  # gdFsSeek(gdfs, setor, origem)
  0x8C15B71C,  # gdFsTell(gdfs)
  0x8C15B732,  # (gdfs, &fim_de_arquivo)
  0x8C15B75A,  # gdFsSetTransMode(gdfs, modo)
  0x8C15B774,  # gdFsRead(gdfs, nsct, buf)
  0x8C15B7FA,  # leitura por PIO (interna)        (guarda)
  0x8C15B8D4,  # gdFsReqRd32(gdfs, nsct, buf)
  0x8C15B548,  # espera do pedido (interna)        (guarda)
  0x8C15BBF8,  # gdFsGetStat(gdfs)
  0x8C15BC10,  # gdFsGetTransStat(gdfs) -> bytes
  0x8C15BC26,  # gdFsStop(gdfs)
  0x8C15BD40,  # gdFsGetErr(gdfs)
  0x8C15BD58,  # callback de fim de leitura (gdfs, func, obj)
  0x8C15BDA4,  # callback 2 (gdfs, func, obj)
  0x8C15BDDE,  # callback de erro (gdfs, func, obj)
  0x8C15AE28,  # servidor do gdFs (interno): conclui os pedidos assincronos nativos
]
# N2b (docs/N2b-PLANO.md, secao 1.2): back-edges dos lacos que esperam uma condicao acesa por
# evento. O gerador emite BS_WAIT no desvio de volta e BS_WAIT_END na instrucao seguinte (por
# onde passam todas as saidas). No N2b-1 so informam o monitor de progresso (modo sombra).
# A thread 3 (servidor do CRI, 8C158840) NAO entra: trabalha ate ser preemptada.
#
# N2b-2 (--tempo experimental; o tempo nativo estavel ignora estes pontos): esperas do inventario
# docs/N2b-ESPERAS.md e o back-edge condicional da thread 3. O que libera cada uma fica em
# transitional/time_adapter.cpp (kWaitDecls). Back-edges com delay slot (bra) entram tambem: o
# BS_WAIT vem depois do slot.
esperas = [
  0x8C064A2C,  # espera do VBlank do jogo (bandeira 0x8C24F88A), funcao 8C064A20
  0x8C173086,  # espera do fim do render anterior, timeout 166 ms (8C173044)
  0x8C0978F6,  # espera de bit com timeout (8C0978BE; nao exercitada no roteiro)
  # N2b-2: esperas temporais do boot (V2 e V13)
  0x8C172628,  # vsync do SPG_STATUS acender (laco 8C172624, f_8C172620)
  0x8C17262E,  # vsync do SPG_STATUS apagar (laco 8C17262A)
  0x8C172808,  # VBlank-In em ISTNRM (laco 8C172804, f_8C172642)
  0x8C172EF8,  # contador do callback de VBlank 8C172602 (laco 8C172EF2, f_8C172D22)
  0x8C1C6D06,  # linha do SPG_STATUS sair de 0 (laco 8C1C6CB0, f_8C1C6B3C)
  0x8C1C6D0E,  # linha do SPG_STATUS voltar a 0 (laco 8C1C6D08)
  # N2b-2: esperas sincronas (a condicao e satisfeita na escrita; volta = erro explicito)
  0x8C1C1DC6,  # DMA ch2: C2DST = 0 (f_8C1C1DB4)
  0x8C096EE8,  # FIFO do G2 vazia, SB_FFST bit 0 (getter 8C09A054)
  0x8C096EF8,  # idem, segundo teste
  0x8C097254,  # FIFO do G2 vazia, SB_FFST bit 5 (getter 8C09A1F4)
  0x8C097264,  # idem, segundo teste
  # N2b-2: thread 3 (servidor do CRI, laco 8C158840): bloqueia so depois de passada ociosa
  0x8C158860,  # back-edge bra da passada 8C1586B8
]
