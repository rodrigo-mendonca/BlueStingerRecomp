# N8.1, cadencia B (docs/N8-1-PREPARACAO.md): excecoes de SPC contra as 16 referencias do N8.0, uma por diferenca
# (docs/N8-0-REFERENCIAS.md secao 5), com a evidencia de cada uma conferida por tools/dev/n8_excecoes_cadencia.py. APROVADA pelo mantenedor
# em 2026-10-25 a solucao "com correcao" (a espera do hardware restaura o ponto de retomada antes de cada
# atendimento). O SPC so passa pelo tratador 8C1982F4 em stc.l spc,@-r15 (8C19831C) e ldc.l @r15+,spc (8C19845A)
# antes do rte em 8C198462; um rte desviado aparece como R no trace e e conferido abaixo. Nenhuma vale no estavel.

[[spc]]
caso = "passo_cgate_experimental"
vblank = 4
intevt = "00000320"
spc_ref = "8C1983D2"
spc_novo = "8C15DE72"
justificativa = "entrega dentro da espera do hardware (timed_wait do slot nativo do download da musica): o SPC da referencia, 8C1983D2, era um c->pc velho: retomada do BS_IRQ_CHECK do ldc r1,sr em 8C1983D0 (codigo aninhado). O novo e o retorno da chamada (8C15DE6E: jsr @r3 (download da musica no boot), delay slot 8C15DE70), o mesmo SPC da primeira entrega desta espera na referencia (evento 4)"
evidencia = "exe 2B82F22E, evento 6: eventos seguintes ate a proxima I/V iguais na referencia e na nova (R 8C17DE4C), sem T nem J; esta entrega e a primeira da espera (evento 4) tem origem hardware no BS_INTC_TRACE, sem T, J nem N entre elas; passo de jogo 0; estado do passo 1 (o primeiro gravado no VBlank ou depois) igual. O resto do caso (estado, saves, quadros, leituras, audio, legendas, cartao, relogios) e conferido pelo n8_referencias.py com esta lista"

